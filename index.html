<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Есть один вопрос 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card intro-card" id="introScreen">
      <div class="heart">♡</div>
      <p class="small-text">Юля, в прошлый раз все получилось спонтанно, теперь предлагаю оффициально)</p>
      <h1>Пойдёшь со мной на свидание?</h1>
      <div class="buttons">
        <button class="btn btn-yes" id="yesButton" type="button">Да 💗</button>
        <button class="btn btn-no" id="noButton" type="button">Нет</button>
      </div>
    </section>

    <section class="card plan-card hidden" id="planScreen">
      <div class="heart">♥</div>
      <p class="small-text">Тогда давай выберем наш маленький план</p>
      <h1>Когда и куда ты хотела бы пойти?</h1>

      <form id="dateForm">
        <div class="fields">
          <label>
            <span>Дата</span>
            <input type="date" id="date" name="date" required>
          </label>

          <label>
            <span>Время</span>
            <input type="time" id="time" name="time" required>
          </label>

          <label class="full-width">
            <span>Место</span>
            <input
              type="text"
              id="place"
              name="place"
              placeholder="Азиатское кафе, караоке, парк, кино..."
              maxlength="80"
              required
            >
          </label>

          <label class="full-width">
            <span>Что-нибудь ещё?</span>
            <textarea
              id="note"
              name="note"
              placeholder="Напиши свои пожелания или оставь мне подсказку..."
              maxlength="300"
              rows="4"
            ></textarea>
          </label>
        </div>

        <button class="btn confirm-btn" id="submitButton" type="submit">
          Сохранить
        </button>
      </form>
    </section>

    <section class="card result-card hidden" id="resultScreen">
      <div class="heart big-heart">♥</div>
      <p class="small-text">План готов</p>
      <h1>До встречи ✨</h1>

      <div class="summary">
        <div class="summary-row">
          <span>Дата</span>
          <strong id="resultDate">—</strong>
        </div>
        <div class="summary-row">
          <span>Время</span>
          <strong id="resultTime">—</strong>
        </div>
        <div class="summary-row">
          <span>Место</span>
          <strong id="resultPlace">—</strong>
        </div>
        <div class="summary-row note-row" id="resultNoteRow">
          <span>Заметка</span>
          <strong id="resultNote">—</strong>
        </div>
      </div>

      <button class="btn restart-btn" id="restartButton" type="button">
        Изменить выбор
      </button>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
